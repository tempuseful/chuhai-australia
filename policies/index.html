<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地方外贸扶持政策库｜出海国别简报</title>
<meta name="description" content="各省市鼓励出口和境外参展的扶持政策：境外参展补贴、出口信用保险保费补贴、跨境电商和海外仓、品牌认证、融资贴息，按地区和类型筛选，附原文链接。">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* 布局：终端式行情带 + 财经头版。全宽黑底栏目条分节，数据用等宽字，标题用重磅宋体 */
:root{
  --bg:#07090d; --panel:#0e1219; --panel2:#141a24; --line:#232b38;
  --fg:#e9edf3; --muted:#8b96a8; --amber:#ffa028; --amber-ink:#07090d;
  --up:#2fd08a; --down:#ff5a5f; --blue:#4aa8ff;
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#e9ecf1; --line:#cfd5de;
  --fg:#0b0f16; --muted:#566173; --amber:#b85c00; --amber-ink:#ffffff;
  --up:#0a7a4b; --down:#c22b30; --blue:#0b5cad; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#e9ecf1; --line:#cfd5de;
  --fg:#0b0f16; --muted:#566173; --amber:#b85c00; --amber-ink:#ffffff;
  --up:#0a7a4b; --down:#c22b30; --blue:#0b5cad; color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.75;margin:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .am{color:var(--amber)}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand b{background:var(--amber);color:var(--amber-ink);font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 7px;letter-spacing:.08em}
.nav{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-left:auto}
.nav a{color:var(--muted)} .nav a:hover{color:var(--fg);text-decoration:none}

/* 行情带 */
.tape{background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.tape-in{display:inline-flex;gap:36px;padding:8px 18px;animation:roll 60s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tape span{font-size:12.5px;color:var(--muted)} .tape span i{font-style:normal;font-family:var(--mono);color:var(--fg);margin-left:8px}
@keyframes roll{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape-in{animation:none}.tape{overflow-x:auto}}

/* 头版 */
.hero{padding-block:44px 30px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,54px);line-height:1.22;margin:12px 0 16px;text-wrap:balance;letter-spacing:.01em}
.lead{max-width:42em;color:var(--muted);font-size:16.5px;line-height:1.85;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:30px;border-top:2px solid var(--amber)}
.stat{padding:16px 16px 14px 0;border-right:1px solid var(--line);min-width:0}
.stat+.stat{padding-left:16px} .stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:clamp(24px,3.4vw,36px);font-weight:600;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* 分节 */
section{padding-block:38px;border-bottom:1px solid var(--line)}
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.sh h2{font-family:var(--serif);font-weight:700;font-size:26px;margin:0;line-height:1.25}
.sh .tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--amber-ink);background:var(--amber);padding:2px 8px}
.sh p{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:28px}
.cols>*{min-width:0}
h3{font-size:15px;margin:0 0 10px;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* 指标表 */
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right} td.num{white-space:nowrap}
tbody tr:hover{background:var(--panel)}
td strong{font-weight:700}

/* 贸易图 */
.bars{display:grid;gap:12px}
.yr{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.yr>span{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0}
.bar i{display:block;height:11px;min-width:2px}
.bar.e i{background:var(--amber)} .bar.m i{background:var(--blue)}
.bar b{font-family:var(--mono);font-size:12px;font-weight:500}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px}

/* 痛点 */
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.pain{background:var(--bg);padding:20px;min-width:0}
.pain .k{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber);line-height:1.2}
.pain h3{font-family:var(--serif);font-size:18px;font-weight:700;margin:8px 0 6px}
.pain p{margin:0;font-size:14.5px;line-height:1.8;color:var(--muted)}
.pain p.do{color:var(--fg);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.pain p.do::before{content:"对策";font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--up);margin-right:8px}

/* 路线 */
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px}
.steps li{counter-increment:s;display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line);min-width:0}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:20px;font-weight:600;color:var(--amber);line-height:1.3}
.steps h3{margin-bottom:4px;font-family:var(--serif);font-size:17px} .steps p{margin:0;font-size:14.5px;line-height:1.8;color:var(--muted)}

/* 赛道 */
.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px}
.track{padding:16px 0;border-top:1px solid var(--line);min-width:0}
.track h3{font-family:var(--serif);font-size:17px;font-weight:700}
.track p{margin:0;font-size:14.5px;line-height:1.8;color:var(--muted)}
.heat{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:1px 6px;border:1px solid currentColor;margin-left:8px;vertical-align:2px;white-space:nowrap}

/* 动态 */
.feedhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 14px;padding-top:18px;border-top:2px solid var(--amber)}
.feedhead h3{font-family:var(--serif);font-size:20px;font-weight:700;margin:0}
.live{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--up);display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
.feedhead .upd{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chips button{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:5px 12px;cursor:pointer}
.chips button:hover{color:var(--fg);border-color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.chips button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.feed{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.feed li{min-width:0}
.feed li{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.feed time{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.feed .t{font-family:var(--serif);font-weight:700;color:var(--fg);font-size:16px;line-height:1.55}
.feed a.t:hover{color:var(--amber);text-decoration:none}
.feed .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feed .k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid currentColor;padding:0 5px}
.feed .k.pol{color:var(--amber)} .feed .k.news{color:var(--blue)}
.more{font:inherit;font-size:13px;margin-top:14px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 18px;cursor:pointer}
.more:hover{border-color:var(--amber);color:var(--amber)}
.more:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.feedmsg{padding:18px 0;color:var(--muted);font-size:13.5px}
@media (max-width:860px){.feed{grid-template-columns:1fr}}
@media (max-width:480px){.feed li{grid-template-columns:1fr;gap:2px}}

.links{display:grid;grid-template-columns:repeat(3,1fr);gap:0 28px}
.links div{padding:12px 0;border-top:1px solid var(--line);font-size:13.5px;min-width:0}
.links span{display:block;color:var(--muted);font-size:12.5px}
footer{padding-block:28px 48px;font-size:12.5px;color:var(--muted)}
footer ol{padding-left:20px;margin:8px 0 16px}

@media (max-width:860px){
  .cols,.steps,.tracks{grid-template-columns:1fr}
  .pains{grid-template-columns:1fr}
  .links{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat{border-bottom:1px solid var(--line)} .stat:nth-child(2){border-right:0} .stat:nth-child(3){padding-left:0}
  .nav{margin-left:0;gap:12px}
}
@media (max-width:480px){.links{grid-template-columns:1fr}}

/* 多国：返回链接、门户首页 */
.back{font-size:13px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;white-space:nowrap}
.back:hover{color:var(--fg);border-color:var(--muted);text-decoration:none}
.region{padding-block:30px;border-bottom:1px solid var(--line)}
.region h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.card{background:var(--bg);border:1px solid var(--line);padding:18px 20px;min-width:0;display:block;color:var(--fg)}
a.card:hover{background:var(--panel);text-decoration:none}
.card .cn{font-family:var(--serif);font-weight:700;font-size:21px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .cn small{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.1em;color:var(--amber)}
.card p{margin:8px 0 12px;font-size:13.5px;color:var(--muted);line-height:1.7}
.card dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.card dt{font-size:11.5px;color:var(--muted)} .card dd{margin:2px 0 0;font-family:var(--mono);font-size:15px;font-weight:600}
.card.soon{color:var(--muted)} .card.soon .cn{font-size:17px;color:var(--muted)}
.card.soon .cn small{color:var(--muted)}
.cards.mini{grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px} .cards.mini .card{padding:12px 14px}
@media (max-width:860px){.cards{grid-template-columns:1fr}.cards.mini{grid-template-columns:repeat(2,1fr)}}

.cmplink{font-family:var(--mono);font-size:12.5px;color:var(--amber);text-decoration:none;border-bottom:1px solid currentColor;margin-left:auto}
table.cmp{min-width:980px}
table.cmp th a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
table.cmp td{vertical-align:top;font-size:13px}
table.cmp td:first-child,table.cmp th:first-child{position:sticky;left:0;background:var(--bg);white-space:nowrap;font-weight:600}
table.cmp tr.grp td{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--amber);padding-top:22px;border-bottom:1px solid var(--amber)}
table.cmp{table-layout:fixed;width:100%}
table.cmp td,table.cmp th{white-space:normal;word-break:break-word}
table.cmp td:first-child,table.cmp th:first-child{width:128px;white-space:normal}

.alert{margin:18px 0 0;padding:10px 14px;border-left:3px solid var(--amber);background:var(--panel);font-size:13.5px;color:var(--muted);max-width:820px}
.alert b{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--amber);margin-right:10px}

.card .cn{align-items:center}
.flag{width:28px;height:21px;flex:none;border:1px solid var(--line);object-fit:cover}
.card.soon .flag{width:22px;height:16.5px;opacity:.75}
#hr td.num,table.cmp td.num{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:0}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
.filters select,.filters button{font:inherit;font-family:var(--sans);font-size:13.5px;letter-spacing:0;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:7px 10px;min-width:132px;border-radius:0}
.filters button{min-width:0;cursor:pointer;color:var(--amber)}
#mapbox{position:relative;border:1px solid var(--line);background:var(--panel)}
#map{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
#map .land{fill:var(--panel2);stroke:var(--line);stroke-width:.6}
#map .land.live{fill:color-mix(in srgb,var(--amber) 16%,var(--panel2))}
#map circle{cursor:pointer;fill-opacity:.88}
#map circle.on{stroke:var(--fg)!important;fill-opacity:1}
.zoomer{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.zoomer button{width:30px;height:30px;font-size:18px;line-height:1;color:var(--fg);background:var(--bg);border:1px solid var(--line);cursor:pointer}
#tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);padding:8px 10px;font-size:12.5px;line-height:1.55;width:220px;z-index:2}
#tip b{display:block;font-size:13.5px} #tip span{display:block;color:var(--muted)}
#legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:5px 10px}
.st{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
table.proj td{vertical-align:top;font-size:13.5px}
table.proj td small{display:block;color:var(--muted);font-size:12px}
table.proj td:nth-child(5){white-space:nowrap}
table.proj tbody tr{cursor:pointer} table.proj tbody tr:hover{background:var(--panel)}
table.proj tbody tr.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--amber)}
.maplink{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:26px;padding:16px 20px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
a.maplink+a.maplink{margin-top:12px}
a.maplink:hover{text-decoration:none;border-color:var(--amber)}
.maplink b{font-family:var(--serif);font-size:19px} .maplink span{color:var(--muted);font-size:13.5px} .maplink em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--amber)}

#mapbox{background:#04101d}
#map .shade{fill:#04101d;opacity:.28}
#map .land{fill:none;stroke:rgba(255,255,255,.28)}
#map .land.live{fill:rgba(255,170,60,.13);stroke:rgba(255,190,90,.9)}
#map circle{fill-opacity:1;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8))}

#mapbox{--amber:#ffa028;--up:#2fd08a;--down:#ff5a5f;--blue:#4aa8ff;--muted:#c9d1dc}
#legend,#tip{background:rgba(4,16,29,.88);border-color:rgba(255,255,255,.18);color:#e9edf3}
#legend{color:#c9d1dc} #tip b{color:#fff}
.zoomer button{background:rgba(4,16,29,.88);border-color:rgba(255,255,255,.25);color:#fff}
#map{aspect-ratio:1000/520}

#map .labels{pointer-events:none}
#map .labels text{paint-order:stroke;stroke:rgba(4,16,29,.85);stroke-width:3px;stroke-linejoin:round;font-family:var(--sans)}
#map .labels g,#map .labels text.ctry{transition:opacity .25s}
#map .reg text{text-anchor:middle;fill:#ffc46b}
#map .reg .en{font-family:var(--serif);font-size:13px;letter-spacing:.14em;font-weight:700}
#map .reg .zh{font-size:12px;fill:#fff;font-weight:600}
#map .reg .n{font-family:var(--mono);font-size:15px;font-weight:600}
#map .ctry{text-anchor:middle;fill:#ffe3b0;font-size:13px;font-weight:600;letter-spacing:.08em}
#map .city text{fill:#fff;font-size:11.5px}
#map .city rect{fill:#fff;stroke:rgba(4,16,29,.9);stroke-width:1px}
/* 表格内的数值单元格常夹中文，统一用正文字体，等宽数字保持对齐 */
td.num,th.num{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:0}
/* 用工表：左列标签不折行，右列长说明正常换行并左对齐 */
#hr td.num{white-space:normal;text-align:left}
#hr tbody td:first-child{white-space:nowrap;width:1%;padding-right:18px;vertical-align:top}
#hr td{vertical-align:top}
/* 表格数值单元格允许换行；税务和用工表左列标签不折行 */
td.num{white-space:normal}
#tax tbody td:first-child,#hr tbody td:first-child{white-space:nowrap;vertical-align:top}
#tax td{vertical-align:top}
@media (max-width:700px){#tax tbody td:first-child{white-space:normal;min-width:5.5em}#tax td{overflow-wrap:anywhere}}

/* 森帆跨境 Sailfin 页脚品牌 */
footer .sailfin{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:10px 0 4px;color:inherit}
footer .sailfin .sf-lab{font-size:12px;color:var(--muted);margin-right:6px;padding-right:12px;border-right:1px solid var(--line)}
footer .sailfin .sf-ico{width:22px;height:27px;flex:none}
footer .sailfin .sf-g{fill:#1e4d3b}
footer .sailfin .sf-o{fill:#d9502e}
footer .sailfin .sf-txt{display:flex;flex-direction:column;line-height:1.05}
footer .sailfin .sf-txt b{font-family:var(--sans);font-size:15px;font-weight:800;letter-spacing:.06em;color:#1e4d3b}
footer .sailfin .sf-txt i{font-style:normal;font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.42em;color:#2e8b74;margin-top:3px}
footer .sailfin:hover .sf-txt b{text-decoration:underline;text-underline-offset:3px}
footer .disc{margin:10px 0 0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) footer .sailfin .sf-g{fill:#4f9d7c} :root:not([data-theme="light"]) footer .sailfin .sf-txt b{color:#e6efe9} :root:not([data-theme="light"]) footer .sailfin .sf-txt i{color:#6cc3a6} }
:root[data-theme="dark"] footer .sailfin .sf-g{fill:#4f9d7c}
:root[data-theme="dark"] footer .sailfin .sf-txt b{color:#e6efe9}
:root[data-theme="dark"] footer .sailfin .sf-txt i{color:#6cc3a6}

.tools{margin:4px 0 8px}.tools .maplink:first-child{margin-top:0}

/* 地方外贸扶持政策库 */
.pol-filter{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.pf-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pf-row select,.pf-row input[type=search]{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:7px 10px;min-width:150px}
.pf-row input[type=search]{flex:1;min-width:200px}
.pf-row select:disabled{opacity:.55}
.pf-chk{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pf-row button{font:inherit;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 12px;cursor:pointer}
.pf-count{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--amber)}
#pf-types small{font-family:var(--mono);opacity:.75;margin-left:2px}
.pol-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.pol{background:var(--panel);border:1px solid var(--line);padding:16px 18px;min-width:0;display:flex;flex-direction:column}
.pol-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.pol-where{font-weight:700;color:var(--amber);font-size:13px}
.pol-lv,.pol-type{border:1px solid var(--line);padding:1px 7px;color:var(--muted)}
.pol-exp{background:var(--down);color:#fff;padding:1px 7px}
.pol-top time{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.pol h3{font-family:var(--serif);font-size:17px;line-height:1.45;margin:10px 0 8px}
.pol h3 a{color:var(--fg);text-decoration:none}.pol h3 a:hover{color:var(--amber)}
.pol-hl{margin:0 0 10px;padding-left:18px;font-size:14px;line-height:1.65}
.pol-hl li::marker{color:var(--amber)}
.pol-dl{margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--muted)}
.pol-dl div{display:grid;grid-template-columns:5em 1fr;gap:8px}.pol-dl dt{color:var(--fg);font-weight:600}.pol-dl dd{margin:0}
.pol-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.pol-foot a{margin-left:auto;color:var(--amber);text-decoration:none}
.pol-empty{grid-column:1/-1;color:var(--muted);padding:30px 0;text-align:center}
@media (max-width:860px){.pol-list{grid-template-columns:1fr}.pol-filter{position:static}.pf-count{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">地方外贸政策 <b>POLICY DESK</b></div>
  <a class="back" href="/">全部国家</a>
</div></header>
<main class="wrap">
<div class="hero">
  <div class="kicker" id="pf-meta">地方外贸扶持政策</div>
  <h1>各地鼓励出口和境外参展的扶持政策，一页查清</h1>
  <p class="lead">按省份、城市和政策类型整理各地商务部门的外贸扶持文件：境外参展补贴、出口信用保险保费补贴、跨境电商和海外仓、国际认证、融资贴息等。每条列出补贴比例和上限、申报条件，并附原文链接。</p>
</div>
<section class="pol-filter" aria-label="筛选">
  <div class="pf-row">
    <select id="pf-prov" aria-label="省份"><option value="">全部省份</option></select>
    <select id="pf-city" aria-label="城市" disabled><option value="">先选省份</option></select>
    <input id="pf-q" type="search" placeholder="搜索：展位费、海外仓、保费…" aria-label="关键词">
    <label class="pf-chk"><input type="checkbox" id="pf-valid"> 只看有效期内</label>
    <button type="button" id="pf-reset">重置</button>
    <span id="pf-count" class="pf-count"></span>
  </div>
  <div class="chips" id="pf-types" role="group" aria-label="政策类型"></div>
</section>
<section id="pol-list" class="pol-list"><p class="pol-empty">加载中…</p></section>
<p class="note">金额、比例和申报时间以原文和当年申报指南为准；多数补贴按年度集中申报，申报前可向当地商务部门确认。</p>
</main>
<footer class="wrap">
  <a class="sailfin" href="https://www.sailfinscm.com/" target="_blank" rel="noopener"><span class="sf-lab">供应链服务</span><svg class="sf-ico" viewBox="20 14 22.5 27.5" aria-hidden="true"><path class="sf-g" d="M21.5 27.5H34L41.8 15H35C27 15 21.5 20 21.5 27.5Z"/><path class="sf-o" d="M28.8 29H41.3C41.3 36 35.8 41 28 41H20.7Z"/></svg><span class="sf-txt"><b>森帆跨境</b><i>SAILFIN</i></span></a>
  <p class="disc">本页为公开信息整理，不构成法律、税务或投资意见。门槛和税率每年调整，具体交易请以官方最新文本和专业顾问意见为准。</p>
</footer>
<script>
// 地方外贸扶持政策库：读取 /policies/policies.json，按省份、城市、类型、关键词筛选
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TYPES = ['境外参展', '出口信用保险', '跨境电商', '海外仓', '品牌认证', '融资贴息', '物流运费', '外贸新业态', '综合措施'];
  const st = { prov: '', city: '', types: new Set(), q: '', valid: false };
  let all = [];
  const today = new Date().toISOString().slice(0, 10);
  const expired = (p) => p.validUntil && p.validUntil < today;

  function params() {
    const u = new URLSearchParams(location.search);
    st.prov = u.get('p') || ''; st.city = u.get('c') || ''; st.q = u.get('q') || '';
    (u.get('t') || '').split(',').filter(Boolean).forEach((t) => st.types.add(t));
  }
  function sync() {
    const u = new URLSearchParams();
    if (st.prov) u.set('p', st.prov); if (st.city) u.set('c', st.city);
    if (st.types.size) u.set('t', [...st.types].join(',')); if (st.q) u.set('q', st.q);
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }

  function fillProv() {
    const order = ['全国'];
    const provs = [...new Set(all.map((p) => p.province))].sort((a, b) => (order.indexOf(b) - order.indexOf(a)) || a.localeCompare(b, 'zh'));
    const n = (pv) => all.filter((p) => p.province === pv).length;
    $('pf-prov').innerHTML = '<option value="">全部省份</option>' + provs.map((pv) => `<option value="${esc(pv)}"${pv === st.prov ? ' selected' : ''}>${esc(pv)}（${n(pv)}）</option>`).join('');
    fillCity();
  }
  function fillCity() {
    const cities = [...new Set(all.filter((p) => p.province === st.prov && p.city).map((p) => p.city))].sort((a, b) => a.localeCompare(b, 'zh'));
    const sel = $('pf-city');
    sel.disabled = !st.prov || !cities.length;
    sel.innerHTML = '<option value="">' + (st.prov ? '省级及全部城市' : '先选省份') + '</option>' + cities.map((c) => `<option value="${esc(c)}"${c === st.city ? ' selected' : ''}>${esc(c)}</option>`).join('');
    if (st.city && !cities.includes(st.city)) st.city = '';
  }
  function fillTypes() {
    $('pf-types').innerHTML = TYPES.map((t) => `<button type="button" data-t="${t}" aria-pressed="${st.types.has(t)}">${t} <small>${all.filter((p) => (p.types || []).includes(t)).length}</small></button>`).join('');
  }

  function match(p) {
    if (st.prov && p.province !== st.prov) return false;
    if (st.city && p.city !== st.city && !String(p.city).startsWith(st.city)) return false;
    if (st.types.size && !(p.types || []).some((t) => st.types.has(t))) return false;
    if (st.valid && expired(p)) return false;
    if (st.q) {
      const hay = [p.province, p.city, p.title, p.issuer, p.docNo, (p.highlights || []).join(' '), p.eligibility, p.apply].join(' ').toLowerCase();
      if (!st.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  function card(p) {
    const where = p.city ? p.city : p.province;
    const tag = expired(p) ? '<span class="pol-exp">已过有效期</span>' : '';
    return `<article class="pol">
  <div class="pol-top"><span class="pol-where">${esc(where)}</span><span class="pol-lv">${esc(p.level)}</span>${(p.types || []).map((t) => `<span class="pol-type">${esc(t)}</span>`).join('')}${tag}<time>${esc(p.date)}</time></div>
  <h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
  ${(p.highlights || []).length ? `<ul class="pol-hl">${p.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
  <dl class="pol-dl">${p.eligibility ? `<div><dt>谁能申报</dt><dd>${esc(p.eligibility)}</dd></div>` : ''}${p.apply ? `<div><dt>怎么申报</dt><dd>${esc(p.apply)}</dd></div>` : ''}</dl>
  <div class="pol-foot"><span>${esc(p.issuer)}${p.docNo ? ' · ' + esc(p.docNo) : ''}</span><span>${p.validUntil ? '有效期至 ' + esc(p.validUntil) : ''}</span><a href="${esc(p.url)}" target="_blank" rel="noopener">原文 · ${esc(p.source || '链接')} →</a></div>
</article>`;
  }

  function render() {
    const list = all.filter(match);
    $('pf-count').textContent = `${list.length} / ${all.length} 条`;
    $('pol-list').innerHTML = list.length ? list.map(card).join('') : '<p class="pol-empty">没有符合条件的政策，换个筛选条件试试。</p>';
    $('pf-types').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', st.types.has(b.dataset.t)));
    sync();
  }

  function bind() {
    $('pf-prov').onchange = (e) => { st.prov = e.target.value; st.city = ''; fillCity(); render(); };
    $('pf-city').onchange = (e) => { st.city = e.target.value; render(); };
    $('pf-types').onclick = (e) => { const b = e.target.closest('button[data-t]'); if (!b) return; const t = b.dataset.t; st.types.has(t) ? st.types.delete(t) : st.types.add(t); render(); };
    let tm; $('pf-q').value = st.q; $('pf-q').oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 180); };
    $('pf-valid').onchange = (e) => { st.valid = e.target.checked; render(); };
    $('pf-reset').onclick = () => { st.prov = st.city = st.q = ''; st.types.clear(); st.valid = false; $('pf-q').value = ''; $('pf-valid').checked = false; fillProv(); render(); };
  }

  params();
  fetch('/policies/policies.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => {
    all = (d.items || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    $('pf-meta').textContent = `收录 ${all.length} 条 · 覆盖 ${new Set(all.map((p) => p.province)).size} 个省级地区 · 更新于 ${d.updated || ''}`;
    fillProv(); fillTypes(); bind(); render();
  }).catch(() => { $('pol-list').innerHTML = '<p class="pol-empty">政策数据加载失败，请刷新重试。</p>'; });
})();
</script>
<script src="/consult.js" defer></script>
</body>
</html>
